<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
</head>
<body>
<title>Bagel Bakery Math Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: sticky bakery header with 5E stage rail, one activity card at a time, prev/next footer. */
:root{
  --bg:#f2f5fb; --surface:#ffffff; --surface-2:#e7edf8; --ink:#1b2a4a; --ink-2:#52618a; --line:#cfd8ea;
  --brand:#2f4fd0; --brand-ink:#ffffff; --accent:#e8a317; --accent-soft:#fbefd2; --dough:#d9a35a; --dough-dark:#a8702c;
  --good:#1d875a; --good-bg:#dcf3e7; --bad:#c4412d; --bad-bg:#fbe3de; --warn:#9a6511;
  --pv-th:#7b4bd1; --pv-h:#d9512f; --pv-t:#2a72d6; --pv-o:#1b915d;
  --pv-th-bg:#ece3fb; --pv-h-bg:#fde4dc; --pv-t-bg:#e0ecfc; --pv-o-bg:#daf2e5;
  --pink:#e05a9a; --pink-bg:#fde3ef; --orange:#e07a1f; --orange-bg:#fdebd8; --yellow:#b88b00; --yellow-bg:#fbf1c9; --green:#2e9a4f; --green-bg:#def3e3;
  --shadow:0 1px 2px rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.07);
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1526; --surface:#162139; --surface-2:#1e2b48; --ink:#e9eefb; --ink-2:#a3b1d1; --line:#2c3b5e;
  --brand:#7f99ff; --brand-ink:#0e1526; --accent:#f2b740; --accent-soft:#3a2d12; --dough:#d9a35a; --dough-dark:#8a5a22;
  --good:#4fc98f; --good-bg:#123a29; --bad:#ff7b64; --bad-bg:#43201a; --warn:#f0b54a;
  --pv-th:#b597ff; --pv-h:#ff8b6c; --pv-t:#6fa9ff; --pv-o:#52d396;
  --pv-th-bg:#2b2150; --pv-h-bg:#3d2219; --pv-t-bg:#172f52; --pv-o-bg:#133a2a;
  --pink:#ff86bd; --pink-bg:#3f1a2d; --orange:#ffa45a; --orange-bg:#3f2712; --yellow:#f2cc4a; --yellow-bg:#3a3210; --green:#5fd27f; --green-bg:#15361f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1526; --surface:#162139; --surface-2:#1e2b48; --ink:#e9eefb; --ink-2:#a3b1d1; --line:#2c3b5e;
  --brand:#7f99ff; --brand-ink:#0e1526; --accent:#f2b740; --accent-soft:#3a2d12; --dough:#d9a35a; --dough-dark:#8a5a22;
  --good:#4fc98f; --good-bg:#123a29; --bad:#ff7b64; --bad-bg:#43201a; --warn:#f0b54a;
  --pv-th:#b597ff; --pv-h:#ff8b6c; --pv-t:#6fa9ff; --pv-o:#52d396;
  --pv-th-bg:#2b2150; --pv-h-bg:#3d2219; --pv-t-bg:#172f52; --pv-o-bg:#133a2a;
  --pink:#ff86bd; --pink-bg:#3f1a2d; --orange:#ffa45a; --orange-bg:#3f2712; --yellow:#f2cc4a; --yellow-bg:#3a3210; --green:#5fd27f; --green-bg:#15361f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.split-ctl label.row{flex-wrap:nowrap;align-items:flex-start}
.split-ctl label.row input{margin-top:5px;flex:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
b,strong{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0}
.top-in{max-width:1040px;margin:0 auto}
.brand-row{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-size:.78rem;color:var(--ink-2);font-weight:400;letter-spacing:.02em}
.bagel{--s:28px;width:var(--s);height:var(--s);border-radius:50%;flex:none;
  background:radial-gradient(circle at 50% 50%,var(--surface) 0 22%,transparent 23%),
  radial-gradient(circle at 35% 30%,#f6d9a3 0 8%,transparent 9%),radial-gradient(circle at 65% 70%,#f6d9a3 0 6%,transparent 7%),
  radial-gradient(circle at 50% 50%,var(--dough) 0 62%,var(--dough-dark) 63% 100%);
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:4px 12px 4px 6px;font-weight:700;font-variant-numeric:tabular-nums}
.pill .bagel{--s:22px}
.pill.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
.rail{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.stage{flex:1 1 0;min-width:96px;border:0;background:transparent;padding:6px 6px 10px;border-bottom:3px solid transparent;text-align:left;color:var(--ink-2)}
.stage .nm{font-family:var(--f-display);font-weight:700;font-size:1rem;display:block}
.stage .dots{display:flex;gap:4px;margin-top:3px}
.stage .dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.stage .dot.done{background:var(--good)}
.stage .dot.cur{box-shadow:0 0 0 2px var(--brand)}
.stage.on{color:var(--brand);border-bottom-color:var(--brand)}

/* Main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1040px;margin:0 auto}
.head{margin-bottom:16px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.head h2{font-size:clamp(1.6rem,4vw,2.3rem);font-weight:800;margin-top:2px}
.head p{margin:.4rem 0 0;color:var(--ink-2);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
.phase{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.phase h3{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.step-n{font-family:var(--f-display);font-size:.85rem;font-weight:700;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:1px 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.grid2>*{min-width:0}
p{margin:.35rem 0}
.muted{color:var(--ink-2)}
.big{font-size:1.15rem}
.num-t{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Buttons & inputs */
.btn{border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:10px;padding:9px 16px;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.gold{background:var(--accent);color:#2b1f00}
.link{border:0;background:none;color:var(--brand);text-decoration:underline;padding:4px 0;font-size:.95rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input.num{font-family:var(--f-num);font-size:1.2rem;padding:7px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:100%;text-align:center}
input.num:focus{border-color:var(--brand);outline:none}
input.num:disabled{border-color:var(--good);background:var(--good-bg);color:var(--ink);opacity:1}
.ask{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2)}
.ask-q{font-weight:700}
.ask-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb{min-height:1.2em;font-size:.97rem}
.fb.good{color:var(--good);font-weight:700}
.fb.bad{color:var(--bad)}
.fb.warn{color:var(--warn)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;font-size:1.02rem;min-width:0}
.choice:hover:not(:disabled){border-color:var(--brand)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.choice:disabled{cursor:default}
.callout{border-radius:12px;padding:12px 14px;background:var(--accent-soft);border:1px solid var(--accent)}
.callout.good{background:var(--good-bg);border-color:var(--good)}
.tag{display:inline-block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}

/* place value colors */
.pv-th{color:var(--pv-th)}.pv-h{color:var(--pv-h)}.pv-t{color:var(--pv-t)}.pv-o{color:var(--pv-o)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:currentColor;vertical-align:-1px}

/* Bakery boxes */
.shelf{display:flex;flex-wrap:wrap;gap:6px;padding:12px;border-radius:12px;background:var(--surface-2);min-height:84px;align-content:flex-start}
.box{width:46px;height:26px;border-radius:5px;background:var(--accent-soft);border:1.5px solid var(--dough-dark);display:grid;grid-template-columns:repeat(6,1fr);gap:1px;padding:2px;animation:drop .3s ease-out}
.box i{border-radius:50%;background:radial-gradient(circle,var(--accent-soft) 0 25%,var(--dough) 27%)}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}
.box-big{width:min(100%,260px);height:auto;aspect-ratio:2.6;gap:6px;padding:10px;border-width:3px;border-radius:10px;animation:none}
.counter{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.counter div{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.counter b{display:block;font-family:var(--f-num);font-size:1.5rem;font-variant-numeric:tabular-nums}
.counter small{color:var(--ink-2);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700}

/* number line */
.nl{width:100%;height:auto;max-width:640px;display:block}
.nl text{font-family:var(--f-num);font-size:13px;fill:var(--ink-2)}
.nl .lab{font-family:var(--f-body);font-weight:700;font-size:14px}

/* area model */
.am-wrap{overflow-x:auto}
.am{display:grid;gap:4px;min-width:300px}
.am .hd{font-family:var(--f-num);font-weight:500;text-align:center;font-size:1rem;padding:2px;align-self:end}
.am .rh{font-family:var(--f-num);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.am .cell{border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;min-height:74px;border:2px dashed var(--line);background:var(--surface);min-width:0;text-align:center;transition:background .3s}
.am .cell .ex{font-size:.82rem;color:var(--ink-2);font-family:var(--f-num)}
.am .cell input{width:100%;max-width:8ch;font-size:1rem;padding:4px}
.am .cell.ok{border-style:solid}
.am .cell .val{font-family:var(--f-num);font-size:1.15rem;font-weight:500}
.split-ctl{display:grid;gap:8px}
input[type=range]{width:100%;accent-color:var(--brand)}
.split-eq{font-family:var(--f-num);font-size:1.6rem}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.flip{perspective:900px;border:0;background:none;padding:0;min-height:170px;text-align:left}
.flip-in{position:relative;width:100%;height:100%;min-height:170px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip .f,.flip .bk{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);background:var(--surface)}
.flip .bk{transform:rotateY(180deg);background:var(--surface-2)}
.flip .f h4{font-family:var(--f-display);font-size:1.3rem;margin:0}
.flip .eg{font-family:var(--f-num);font-size:1.05rem;margin-top:auto}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}*{animation:none!important}}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .choice{font-size:.95rem}
.match .choice.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}

/* algorithm workshop */
.algo{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.algo{grid-template-columns:1fr}}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;
  background-image:linear-gradient(var(--surface-2) 1px,transparent 1px),linear-gradient(90deg,var(--surface-2) 1px,transparent 1px);background-size:2.6rem 2.6rem}
.arow{display:flex;align-items:center}
.ac{width:2.6rem;height:2.6rem;display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:1.55rem;border-radius:8px;flex:none;transition:background .2s}
.arow.small .ac{height:1.5rem;font-size:.95rem;color:var(--bad);font-weight:700}
.arow.small .ac.old{color:var(--ink-2);text-decoration:line-through;opacity:.55}
.arow.rule{height:3px;background:var(--ink);border-radius:2px;margin:3px 0}
.ac.hl{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.ac.new{animation:pop .45s}
.ac.zero{color:var(--ink-2)}
.rlab{font-size:.85rem;color:var(--ink-2);padding-left:10px;white-space:nowrap;font-family:var(--f-num)}
.coach{display:flex;flex-direction:column;gap:10px}
.coach .phase-name{font-family:var(--f-display);font-weight:700;color:var(--brand);font-size:1.05rem}
.coach .prompt{font-family:var(--f-num);font-size:1.6rem}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}

/* work display (error analysis) */
.work{font-family:var(--f-num);font-size:1.5rem;display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;padding:10px 16px;background:var(--surface-2);border-radius:12px}
.work .ln{display:flex;align-items:center;gap:10px;justify-content:flex-end;border:2px solid transparent;border-radius:8px;padding:0 8px;width:100%}
.work button.ln{background:none;font:inherit;text-align:right}
.work button.ln:hover:not(:disabled){border-color:var(--brand)}
.work .ln.wrong{border-color:var(--bad);background:var(--bad-bg)}
.work .ln.right{border-color:var(--good)}
.work .rule{height:3px;width:100%;background:var(--ink);border-radius:2px}
.work .note{font-family:var(--f-body);font-size:.8rem;color:var(--ink-2)}

/* dialogue */
.talk{display:flex;flex-direction:column;gap:10px}
.say{display:flex;gap:10px;align-items:flex-start;max-width:640px}
.say .av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;color:#fff}
.say .bub{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:10px 12px;min-width:0}
.say.r{align-self:flex-end;flex-direction:row-reverse}
.say.r .bub{border-radius:14px 4px 14px 14px;background:var(--accent-soft)}
.tf{display:grid;gap:10px}
.tf-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px}
.tf-item .row{flex-wrap:nowrap}
.tf-item .choice{padding:6px 12px}
.tf-item .why{grid-column:1/-1;font-size:.93rem}
@media (max-width:520px){.tf-item{grid-template-columns:1fr}}

/* quadrants */
.quads{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.quad{border:2px solid transparent;border-radius:12px;padding:12px;text-align:left;min-width:0}
.quad .q-t{font-family:var(--f-display);font-weight:800;font-size:1.1rem;display:flex;justify-content:space-between;gap:6px}
.quad small{display:block;font-size:.9rem;margin-top:2px}
.quad.pink{background:var(--pink-bg)}.quad.pink .q-t{color:var(--pink)}
.quad.orange{background:var(--orange-bg)}.quad.orange .q-t{color:var(--orange)}
.quad.yellow{background:var(--yellow-bg)}.quad.yellow .q-t{color:var(--yellow)}
.quad.green{background:var(--green-bg)}.quad.green .q-t{color:var(--green)}
.quad.on{border-color:currentColor}
.quad.pink.on{border-color:var(--pink)}.quad.orange.on{border-color:var(--orange)}.quad.yellow.on{border-color:var(--yellow)}.quad.green.on{border-color:var(--green)}
.check{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;align-items:center;justify-content:center;font-size:.8rem;flex:none}

/* patio + heart */
.patio{width:100%;height:auto;display:block;border-radius:8px;background:var(--surface-2)}
.heart-stage{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.heart{width:110px;height:100px;flex:none;animation:beat var(--d,1s) infinite ease-in-out;transform-origin:center}
.heart path{fill:var(--bad)}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(.97)}45%{transform:scale(1.07)}}
.animals{display:flex;gap:8px;flex-wrap:wrap}

/* certificate */
.cert{border:3px double var(--accent);border-radius:16px;padding:24px;text-align:center;background:linear-gradient(var(--accent-soft),var(--surface) 70%)}
.cert h3{font-size:1.9rem;font-weight:800;justify-content:center}
.cert .who{font-family:var(--f-display);font-size:2rem;font-weight:700;color:var(--brand);border-bottom:2px solid var(--line);display:inline-block;min-width:220px;padding:0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.95rem}
.chip.on{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
textarea{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);min-height:70px}
input.txt{font:inherit;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}

/* footer */
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;align-items:center}
.foot .btn{padding:11px 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;transition:transform .3s;z-index:20;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast:not(.show){visibility:hidden;transition:transform .3s,visibility 0s .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .bagel{--s:20px}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand"><span class="bagel" aria-hidden="true"></span><h1>Bagel Bakery Math Lab<small>Multiply 3-digit by 2-digit numbers · CCSS 5.NBT.B.5</small></h1></div>
      <span class="pill" id="score" title="Bagels earned for first-try answers"><span class="bagel" aria-hidden="true"></span><span id="scoreN">0</span>&nbsp;bagels</span>
    </div>
    <nav class="rail" id="rail" aria-label="5E stages"></nav>
  </div>
</header>
<main><div class="wrap">
  <div class="head"><div class="eyebrow" id="eyebrow"></div><h2 id="title"></h2><p id="intro"></p></div>
  <div id="screen" class="stack"></div>
  <div class="foot"><button class="btn ghost" id="prev">Back</button><span class="muted" id="pos"></span><button class="btn" id="next">Next</button></div>
</div></main>
<div class="toast" id="toast"><span class="bagel" aria-hidden="true"></span><span id="toastT"></span></div>

<script>
/* ---------- state ---------- */
const KEY='bagel-lab-v1';
let S={done:{},bagels:0,name:'',refl:{},cur:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&typeof s==='object') S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('en-US');
const parseNum=s=>{s=String(s).replace(/[,\s]/g,'');return /^-?\d+$/.test(s)?+s:NaN};
function h(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
const PV=['ones','tens','hundreds','thousands','ten thousands','hundred thousands'];
const PVC=['pv-o','pv-t','pv-h','pv-th','pv-th','pv-th'];
const digits=n=>String(n).split('').reverse().map(Number);
const PRAISE=['Nice work!','You got it!','Exactly right!','Spot on!','Great thinking!','Perfect!'];
let uid=0; const nid=p=>(p||'q')+(++uid);

function earn(n){S.bagels+=n;save();$('#scoreN').textContent=S.bagels;const p=$('#score');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')}
let toastTimer;function toast(t){$('#toastT').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}

/* ---------- reusable pieces ---------- */
// numeric question. answer: number or fn(v)->true|string
function ask(parent,o){
  const id=nid('a');
  const box=h(`<div class="ask"><label class="ask-q" for="${id}">${o.q}</label><div class="ask-row"><input id="${id}" class="num" inputmode="numeric" autocomplete="off" style="width:${o.w||9}ch" aria-describedby="${id}f">${o.unit?`<span>${o.unit}</span>`:''}<button class="btn">Check</button></div><div class="fb" id="${id}f" aria-live="polite"></div></div>`);
  const inp=box.querySelector('input'),fb=box.querySelector('.fb'),btn=box.querySelector('button');
  let tries=0,done=false;
  const finish=(msg)=>{done=true;inp.disabled=true;btn.disabled=true;fb.className='fb good';fb.innerHTML=msg;const r=box.querySelector('.reveal');r&&r.remove();o.onCorrect&&o.onCorrect(parseNum(inp.value))};
  function check(){
    if(done)return;const v=parseNum(inp.value);
    if(isNaN(v)){fb.className='fb warn';fb.textContent='Type a whole number (commas are fine).';return}
    const res=typeof o.answer==='function'?o.answer(v):(v===o.answer?true:false);
    if(res===true){if(tries===0)earn(1);inp.value=fmt(v);finish('✓ '+(o.good||PRAISE[Math.floor(Math.random()*PRAISE.length)]))}
    else{tries++;box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');fb.className='fb bad';
      fb.innerHTML=(typeof res==='string'?res:null)||(o.wrong&&o.wrong[v])||o.hint||'Not yet. Check your place values and try again.';
      if(tries>=2&&typeof o.answer==='number'&&!box.querySelector('.reveal')){const r=h('<button class="link reveal">Show me the answer</button>');r.onclick=()=>{inp.value=fmt(o.answer);finish('The answer is '+fmt(o.answer)+'. '+(o.explain||'Look back at each step to see why.'))};box.appendChild(r)}}
  }
  btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  parent.appendChild(box);return box;
}
// multiple choice. options [{t,ok,fb}]
function choose(parent,o){
  const box=h(`<div class="stack" style="gap:10px">${o.q?`<div class="ask-q">${o.q}</div>`:''}<div class="choices"></div><div class="fb" aria-live="polite"></div></div>`);
  const wrap=box.querySelector('.choices'),fb=box.querySelector('.fb');let tries=0;
  o.options.forEach(op=>{const b=h(`<button class="choice">${op.t}</button>`);b.onclick=()=>{
    if(op.ok){b.classList.add('right');wrap.querySelectorAll('button').forEach(x=>x.disabled=true);fb.className='fb good';fb.innerHTML='✓ '+(op.fb||'Correct!');if(tries===0)earn(1);o.onCorrect&&o.onCorrect()}
    else{tries++;b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.innerHTML=op.fb||'Not quite. Try another one.'}};wrap.appendChild(b)});
  parent.appendChild(box);return box;
}
function phase(parent,n,title,html){const c=h(`<section class="card phase"><h3>${n?`<span class="step-n">Step ${n}</span>`:''}${title}</h3>${html||''}<div class="body stack"></div></section>`);parent.appendChild(c);return c.querySelector('.body')}
function bagelBox(cls){return `<div class="box ${cls||''}">${'<i></i>'.repeat(12)}</div>`}
function numberLine(min,max,step,val,showDist){
  const W=640,x=v=>40+(v-min)/(max-min)*(W-80);let s=`<svg class="nl" viewBox="0 0 ${W} ${showDist?150:100}" role="img" aria-label="Number line from ${min} to ${max} with ${val} marked">`;
  s+=`<line x1="30" x2="${W-30}" y1="60" y2="60" stroke="var(--ink)" stroke-width="2.5"/>`;
  for(let v=min;v<=max;v+=step){const big=v===min||v===max;s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${big?48:54}" y2="${big?72:66}" stroke="var(--ink)" stroke-width="${big?2.5:1.5}"/>`;if(big||(max-min)<=10)s+=`<text x="${x(v)}" y="90" text-anchor="middle" ${big?'class="lab" style="fill:var(--ink)"':''}>${v}</text>`}
  s+=`<circle cx="${x(val)}" cy="60" r="9" fill="var(--accent)" stroke="var(--ink)" stroke-width="2"/><text x="${x(val)}" y="34" text-anchor="middle" class="lab" style="fill:var(--ink)">${val}</text>`;
  if(showDist){const near=(val-min)<(max-val)?min:max,far=near===min?max:min;
    [[far,'var(--bad)',122],[near,'var(--good)',140]].forEach(([e,c,y])=>{const a=Math.min(x(e),x(val)),b=Math.max(x(e),x(val));s+=`<line x1="${a}" x2="${b}" y1="${y-14}" y2="${y-14}" stroke="${c}" stroke-width="4" stroke-linecap="round"/><text x="${(a+b)/2}" y="${y}" text-anchor="middle" class="lab" style="fill:${c}">${Math.abs(val-e)} away from ${e}</text>`})}
  return s+'</svg>';
}

/* ---------- standard algorithm engine ---------- */
function algo(parent,a,b,o={}){
  const P=a*b,td=digits(a),bd=digits(b),pp=bd.map((d,k)=>a*d*Math.pow(10,k));
  const nc=Math.max(String(P).length,String(a).length)+1;
  const id=nid('al');
  const rowsDef=[['c1','small'],['c0','small'],['t',''],['b',''],['r1','rule'],['ac','small'],['p0',''],['p1',''],['r2','rule'],['s','']];
  const root=h(`<div class="algo"><div class="paper" aria-label="Written work"></div><div class="coach"><div class="row" style="justify-content:space-between"><span class="phase-name"></span><span class="muted step-count"></span></div><div class="prog"><i></i></div><div class="ctx"></div><div class="prompt"></div><div class="ask-row"><input class="num" inputmode="numeric" autocomplete="off" style="width:7ch" aria-label="Your answer"><button class="btn">Check</button></div><div class="fb" aria-live="polite"></div><div class="extra"></div></div></div>`);
  const paper=root.querySelector('.paper');
  const cells={},labels={};
  rowsDef.forEach(([r,cls])=>{
    if(cls==='rule'){paper.appendChild(h(`<div class="arow rule" style="width:${nc*2.6}rem"></div>`));return}
    const row=h(`<div class="arow ${cls}"></div>`);
    for(let c=nc-1;c>=0;c--){const cell=h('<span class="ac"></span>');cells[r+c]=cell;row.appendChild(cell)}
    const lab=h('<span class="rlab"></span>');labels[r]=lab;row.appendChild(lab);paper.appendChild(row)});
  const set=(r,c,v,cls)=>{const e=cells[r+c];if(!e)return;e.textContent=v;e.classList.remove('new');void e.offsetWidth;e.classList.add('new');if(cls)e.classList.add(cls);const k=(v==='×'||v==='+')?'':(r[0]==='p'||r==='s'||r==='t'||r==='b')?PVC[c]:'';if(k)e.classList.add(k)};
  td.forEach((d,i)=>set('t',i,d));bd.forEach((d,i)=>set('b',i,d));set('b',nc-1,'×');
  Object.values(cells).forEach(e=>e.classList.remove('new'));
  // steps
  const steps=[];
  bd.forEach((m,k)=>{
    const row='p'+k,crow='c'+k,ph=k===0?`Multiply by ${m} ${PV[0]}`:`Multiply by ${m} ${PV[1]} (= ${m*10})`;
    if(k===1){steps.push({ph,prompt:'Placeholder = ?',ctx:`Now we multiply by the <b class="pv-t">${m}</b> in the tens place. It is worth <b>${m*10}</b>, not ${m}. Multiplying by tens always ends in zero. What digit goes in the <b>ones place</b> of this row?`,answer:0,hl:[['b',1]],
      start(){Object.keys(cells).forEach(key=>{if(key.startsWith('c0')&&cells[key].textContent)cells[key].classList.add('old')})},
      apply(){set(row,0,'0','zero')},say:`The 0 holds the ones place, so every digit after it lands in the right place.`})}
    let carry=0;
    td.forEach((d,i)=>{
      const c=carry,val=m*d+c,last=i===td.length-1,col=i+k;
      steps.push({ph,prompt:`${m} × ${d}${c?` + ${c}`:''} = ?`,
        ctx:`Multiply <b class="${PVC[k]}">${m}</b> by the ${PV[i]} digit <b class="${PVC[i]}">${d}</b>${c?`, then add the <b style="color:var(--bad)">${c}</b> you regrouped`:''}.`,
        answer:val,hl:[['b',k],['t',i]].concat(c?[[crow,i]]:[]),
        wrong:c?{[m*d]:`Close! Don't forget to add the regrouped ${c} on top.`}:{},
        apply(){if(last){String(val).split('').reverse().forEach((ch,j)=>set(row,col+j,ch))}else{set(row,col,String(val%10));if(val>=10)set(crow,i+1,String(Math.floor(val/10)))}
          if(last)labels[row].textContent=`← ${fmt(a)} × ${fmt(m*Math.pow(10,k))}`},
        say:last?`Write ${val} at the front of the row.`:val>=10?`Write ${val%10} in the ${PV[col]} place and regroup ${Math.floor(val/10)} ${PV[col+1]} above the next digit.`:`Write ${val} in the ${PV[col]} place.`});
      carry=last?0:Math.floor(val/10);
    });
  });
  if(bd.length>1){
    const d0=digits(pp[0]),d1=digits(pp[1]),L=Math.max(d0.length,d1.length);let ac=0;
    for(let c=0;c<L;c++){
      const x=d0[c]||0,y=d1[c]||0,cr=ac,sum=x+y+cr,last=c===L-1;
      steps.push({ph:'Add the partial products',prompt:`${x} + ${y}${cr?` + ${cr}`:''} = ?`,
        ctx:`Add the <b class="${PVC[c]}">${PV[c]}</b> column${(d0[c]===undefined||d1[c]===undefined)?' (an empty spot counts as 0)':''}${cr?`, plus the regrouped <b style="color:var(--bad)">${cr}</b>`:''}.`,
        answer:sum,hl:[['p0',c],['p1',c]].concat(cr?[['ac',c]]:[]),
        start(){if(c===0){set('p1',nc-1,'+');labels.s.textContent=''}},
        apply(){if(last){String(sum).split('').reverse().forEach((ch,j)=>set('s',c+j,ch));labels.s.textContent='← product'}else{set('s',c,String(sum%10));if(sum>=10)set('ac',c+1,String(Math.floor(sum/10)))}},
        say:last?`Write ${sum}. Done adding!`:sum>=10?`Write ${sum%10}, regroup ${Math.floor(sum/10)} to the ${PV[c+1]}.`:`Write ${sum}.`});
      ac=last?0:Math.floor(sum/10);
    }
  }
  const phEl=root.querySelector('.phase-name'),cnt=root.querySelector('.step-count'),bar=root.querySelector('.prog i'),ctx=root.querySelector('.ctx'),pr=root.querySelector('.prompt'),inp=root.querySelector('input'),btn=root.querySelector('button'),fb=root.querySelector('.fb'),extra=root.querySelector('.extra');
  let si=0,tries=0;
  function clearHl(){Object.values(cells).forEach(e=>e.classList.remove('hl'))}
  function show(){
    clearHl();extra.innerHTML='';tries=0;
    if(si>=steps.length){return finish()}
    const st=steps[si];st.start&&st.start();
    phEl.textContent=st.ph;cnt.textContent=`Step ${si+1} of ${steps.length}`;bar.style.width=(si/steps.length*100)+'%';
    ctx.innerHTML=st.ctx;pr.textContent=st.prompt;inp.value='';
    st.hl.forEach(([r,c])=>cells[r+c]&&cells[r+c].classList.add('hl'));
  }
  function check(){
    const st=steps[si];if(!st)return;const v=parseNum(inp.value);
    if(isNaN(v)){fb.className='fb warn';fb.textContent='Type a number.';return}
    if(v===st.answer){if(tries===0)earn(1);fb.className='fb good';fb.innerHTML='✓ '+st.say;st.apply();si++;show();if(si<steps.length)inp.focus()}
    else{tries++;root.querySelector('.coach').classList.remove('shake');void root.offsetWidth;root.querySelector('.coach').classList.add('shake');fb.className='fb bad';fb.innerHTML=(st.wrong&&st.wrong[v])||'Not yet. Look at the highlighted digits and try again.';
      if(tries>=2&&!extra.firstChild){const r=h('<button class="link">Show me this step</button>');r.onclick=()=>{inp.value=st.answer;fb.className='fb good';fb.innerHTML=`It's ${st.answer}. ${st.say}`;st.apply();si++;show()};extra.appendChild(r)}}
  }
  function finish(){
    bar.style.width='100%';cnt.textContent='Finished';phEl.textContent='Check: is it reasonable?';pr.innerHTML=`${fmt(a)} × ${fmt(b)} = <b>${fmt(P)}</b>`;ctx.innerHTML='';
    root.querySelector('.ask-row').hidden=true;
    if(o.estimate){choose(extra,{q:`Our estimate was <b>${fmt(o.estimate)}</b>. Is <b>${fmt(P)}</b> a reasonable answer?`,options:[
      {t:'Yes, it is close to the estimate',ok:true,fb:o.reasonFb||`Yes. ${fmt(P)} is close to ${fmt(o.estimate)}, so our work makes sense.`},
      {t:'No, it is way off',fb:`Compare again: ${fmt(P)} and ${fmt(o.estimate)} are in the same ballpark.`}],onCorrect:()=>o.onDone&&o.onDone()})}
    else o.onDone&&o.onDone();
  }
  btn.onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
  parent.appendChild(root);show();return root;
}

/* ---------- screens ---------- */
const STAGES=['Engage','Explore','Explain','Elaborate','Evaluate'];
const screens=[
/* 1 */{id:'mystery',stage:0,title:'The Great Bagel Mystery',intro:'A busy town bakery packed 389 boxes of bagels last month. Each box holds exactly 12 bagels. How many bagels is that?',render(el,done){
  const b1=phase(el,1,'Pack the boxes yourself',`<p>Each box holds 12 bagels in 2 rows of 6.</p><div class="row" style="align-items:flex-start;gap:20px"><div style="flex:1 1 220px;min-width:0">${bagelBox('box-big')}</div><p class="muted" style="flex:2 1 260px;min-width:0">Press the buttons to pack boxes and watch the bagel count grow. Can you reach all 389 boxes by adding 12 each time?</p></div>`);
  const ui=h(`<div class="stack"><div class="row"><button class="btn gold" data-n="1">Pack 1 box</button><button class="btn gold" data-n="10">Pack 10 boxes</button><button class="btn gold" data-n="100">Pack 100 boxes</button><button class="btn ghost" data-n="0">Start over</button></div>
    <div class="counter"><div><small>Boxes packed</small><b class="cb">0</b></div><div><small>Bagels so far</small><b class="cg">0</b></div></div><div class="shelf" aria-label="Packed boxes"></div><div class="fb sum muted"></div></div>`);
  b1.appendChild(ui);let n=0,revealed=false;
  const shelf=ui.querySelector('.shelf'),cb=ui.querySelector('.cb'),cg=ui.querySelector('.cg'),sum=ui.querySelector('.sum');
  function draw(){cb.textContent=fmt(n);shelf.innerHTML='';const show=Math.min(n,48);for(let i=0;i<show;i++)shelf.insertAdjacentHTML('beforeend',bagelBox());
    if(n>show)shelf.insertAdjacentHTML('beforeend',`<span class="tag" style="align-self:center">+ ${fmt(n-show)} more boxes</span>`);
    if(n<=12){cg.textContent=fmt(n*12);sum.innerHTML=n?Array(n).fill('12').join(' + ')+' = '+fmt(n*12):''}
    else{cg.textContent='???';sum.innerHTML=`<b style="color:var(--bad)">That's ${fmt(n)} twelves to add up. Way too slow!</b> We need a faster way to find the total.`}
    if(n>12&&!revealed){revealed=true;step2()}}
  ui.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const k=+b.dataset.n;n=k?Math.min(389,n+k):0;draw()});
  function step2(){const b2=phase(el,2,'Which operation solves it?','<p>The bakery has <b>389 groups</b> of <b>12</b>. Which number sentence finds the total?</p>');
    choose(b2,{options:[{t:'389 + 12',fb:'389 + 12 = 401 only adds one more box. We have 389 boxes of 12.'},{t:'389 − 12',fb:'Subtraction takes away. We are putting all the bagels together.'},{t:'389 × 12',ok:true,fb:'389 groups of 12 means multiplication: 389 × 12.'},{t:'389 ÷ 12',fb:'Division splits a total into groups. We already know the groups and need the total.'}],onCorrect:step3})}
  function step3(){const b3=phase(el,3,'About how big will the total be?','<p>Before calculating, think about size. 389 is close to 400, and 12 is close to 10.</p>');
    choose(b3,{options:[{t:'About 400 bagels',fb:'That is only one bagel per box! Each box has 12.'},{t:'About 4,000 bagels',ok:true,fb:'About 400 × 10 = 4,000. Let\'s check that estimate on the next screen.'},{t:'About 40,000 bagels',fb:'That would need about 100 bagels per box. Each box has only 12.'}],onCorrect:done})}
  draw();
}},
/* 2 */{id:'estimate',stage:0,title:'Which Estimate Makes Sense?',intro:'Rounding gives us a quick benchmark, so we notice if a calculation goes wrong.',render(el,done){
  const b1=phase(el,1,'Round 389 to the nearest hundred','<div class="nl-a"></div><p>Is 389 closer to 300 or to 400?</p>');
  b1.parentElement.querySelector('.nl-a').innerHTML=numberLine(300,400,10,389,false);
  choose(b1,{options:[{t:'300',fb:'Look at the line: 389 is 89 away from 300 but only 11 away from 400.'},{t:'400',ok:true,fb:'389 is only 11 away from 400.'}],onCorrect(){b1.parentElement.querySelector('.nl-a').innerHTML=numberLine(300,400,10,389,true);s2()}});
  function s2(){const b2=phase(el,2,'Round 12 to the nearest ten','<div class="nl-b"></div><p>Is 12 closer to 10 or to 20?</p>');b2.parentElement.querySelector('.nl-b').innerHTML=numberLine(10,20,1,12,false);
    choose(b2,{options:[{t:'10',ok:true,fb:'12 is only 2 away from 10.'},{t:'20',fb:'12 is 8 away from 20 but only 2 away from 10.'}],onCorrect(){b2.parentElement.querySelector('.nl-b').innerHTML=numberLine(10,20,1,12,true);s3()}})}
  function s3(){const b3=phase(el,3,'Find the estimate','<p>Think: 4 hundreds × 10 = 40 hundreds.</p>');ask(b3,{q:'400 × 10 =',answer:4000,wrong:{400:'400 × 10 has one more zero than 400.',40000:'That has one zero too many. 4 hundreds × 10 = 40 hundreds.'},onCorrect:s4})}
  function s4(){const b4=phase(el,4,'Debate with your partner','<div class="grid2"><div class="ask"><span class="tag">Estimate A</span><div class="split-eq">300 × 10 = 3,000</div><p class="muted">Both numbers rounded down a lot.</p></div><div class="ask"><span class="tag">Estimate B</span><div class="split-eq">400 × 10 = 4,000</div><p class="muted">389 rounds up to 400. 12 rounds to 10.</p></div></div>');
    choose(b4,{q:'Which estimate is closer to the real total?',options:[{t:'Estimate A: 3,000',fb:'389 is 89 away from 300, so A throws away almost 90 boxes.'},{t:'Estimate B: 4,000',ok:true,fb:'389 is only 11 away from 400, so B is a much stronger estimate. And because 12 is a bit more than 10, the exact answer should be a little more than 4,000.'}],onCorrect:done})}
}},
/* 3 */{id:'explore',stage:1,title:'Investigate 236 × 14',intro:'Work with your partner. Use your own strategy: estimate, break the numbers apart, and record your partial products.',render(el,done){
  const b1=phase(el,1,'Estimate first','<p>Round to friendly numbers. For example, 236 is about 200 and 14 is about 10. Some partners use 240 and 15 instead.</p>');
  ask(b1,{q:'My estimate for 236 × 14 is about',answer:v=>v>=2000&&v<=4000?true:v<2000?'That is too small. Even 200 × 10 is 2,000.':'That is too big. Even 250 × 15 is under 4,000.',good:'Good estimate. Keep it in mind to check your answer.',onCorrect:s2});
  let a=7,split236=false,locked=false;
  function s2(){
    const b2=phase(el,2,'Break 14 into two parts','<p>Drag the slider to split 14 into two parts. Watch the area model change. Which split makes multiplying easiest?</p>');
    const ctl=h(`<div class="split-ctl"><label for="slider14" class="muted">Split 14 =</label><div class="split-eq" aria-live="polite"></div><input type="range" id="slider14" min="1" max="13" value="${a}"><label class="row" style="gap:8px"><input type="checkbox" id="split236"> Also split 236 by place value (200 + 30 + 6)</label><div class="fb hint muted"></div><div class="row"><button class="btn">Use this split</button></div></div>`);
    b2.appendChild(ctl);const amBox=h('<div class="am-wrap"></div>');b2.appendChild(amBox);
    const eq=ctl.querySelector('.split-eq'),hint=ctl.querySelector('.hint');
    function upd(){eq.innerHTML=`14 = <span class="pv-t">${a}</span> + <span class="pv-o">${14-a}</span>`;hint.innerHTML=(a===10||a===4)?'<b style="color:var(--good)">10 + 4 splits 14 by place value. Multiplying by 10 is easy!</b>':'Any split works, but some are much easier to multiply. Try 10 + 4.';drawAM(amBox,false)}
    ctl.querySelector('input[type=range]').oninput=e=>{a=+e.target.value;upd()};
    ctl.querySelector('#split236').onchange=e=>{split236=e.target.checked;upd()};
    ctl.querySelector('.btn').onclick=()=>{if(locked)return;locked=true;ctl.querySelectorAll('input,button').forEach(x=>x.disabled=true);if(a===4){a=10}s3()};
    upd();
  }
  function parts(){return {cols:split236?[200,30,6]:[236],rows:[a,14-a].sort((x,y)=>y-x)}}
  function drawAM(box,live){
    const {cols,rows}=parts(),tot=cols.reduce((s,c)=>s+c,0);
    const fr=cols.map(c=>Math.max(c/tot,.22).toFixed(3)+'fr').join(' ');
    const rh=rows.map(r=>Math.max(74,Math.round(r/14*220))+'px').join(' ');
    const am=h(`<div class="am" style="grid-template-columns:3.2rem ${fr};grid-template-rows:auto ${rh}"></div>`);
    am.appendChild(h('<span></span>'));
    cols.forEach(c=>am.appendChild(h(`<span class="hd ${c>=100?'pv-h':c>=10?'pv-t':'pv-o'}">${c}</span>`)));
    const cellsList=[];

  nm.querySelector('input').oninput=e=>{S.name=e.target.value;save();cert()};
  function cert(){const nDone=screens.filter(s=>S.done[s.id]).length;const per=STAGES.map((s,i)=>{const sc=screens.filter(x=>x.stage===i);return `${s} ${sc.filter(x=>S.done[x.id]).length}/${sc.length}`}).join(' · ');
    box.innerHTML=`<div class="cert"><span class="tag">Bagel Bakery Math Lab</span><h3>Master Baker of Multiplication</h3><p>This certifies that</p><div class="who">${(S.name||'Your name here').replace(/</g,'&lt;')}</div><p style="margin-top:12px">can multiply 3-digit by 2-digit numbers using partial products, the standard algorithm, and estimation.</p><div class="row" style="justify-content:center;gap:10px;margin-top:8px"><span class="pill"><span class="bagel" aria-hidden="true"></span>${S.bagels} bagels earned</span><span class="tag">${nDone} of ${screens.length} activities</span></div><p class="muted" style="font-size:.85rem;margin-top:10px">${per}</p></div>`}
  cert();check();
}}
];

/* ---------- navigation ---------- */
function renderRail(){
  const r=$('#rail');r.innerHTML='';
  STAGES.forEach((s,i)=>{const sc=screens.map((x,j)=>({x,j})).filter(o=>o.x.stage===i);const on=screens[S.cur].stage===i;
    const b=h(`<button class="stage ${on?'on':''}" ${on?'aria-current="step"':''}><span class="nm">${s}</span><span class="dots">${sc.map(o=>`<span class="dot ${S.done[o.x.id]?'done':''} ${o.j===S.cur?'cur':''}"></span>`).join('')}</span></button>`);
    b.onclick=()=>go(sc[0].j);r.appendChild(b)});
}
function go(i){
  S.cur=Math.max(0,Math.min(screens.length-1,i));save();
  const sc=screens[S.cur];
  $('#eyebrow').textContent=`${STAGES[sc.stage]} · Activity ${S.cur+1} of ${screens.length}`;
  $('#title').textContent=sc.title;$('#intro').textContent=sc.intro;
  const el=$('#screen');el.innerHTML='';
  sc.render(el,()=>{if(!S.done[sc.id]){S.done[sc.id]=true;save();toast(`${sc.title}: complete!`);renderRail()}});
  $('#prev').disabled=S.cur===0;$('#next').textContent=S.cur===screens.length-1?'Finish':'Next';$('#next').disabled=S.cur===screens.length-1;
  $('#pos').textContent=`${S.cur+1} / ${screens.length}`;
  renderRail();window.scrollTo({top:0,behavior:'smooth'});
}
$('#prev').onclick=()=>go(S.cur-1);$('#next').onclick=()=>go(S.cur+1);
$('#scoreN').textContent=S.bagels;
go(S.cur||0);
</script>
